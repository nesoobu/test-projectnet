<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16182f">
  <title>Башня</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK Telegram Mini Apps. Вне Telegram просто ничего не делает. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div id="combo"></div>
  </div>

  <button id="sound" class="icon-btn" aria-label="Звук">🔊</button>

  <div id="menu" class="screen">
    <h1>Башня</h1>
    <p class="hint">Нажимай, чтобы ставить блоки.<br>Точное попадание — бонус!</p>
    <p class="best">Рекорд: <b id="menu-best">0</b></p>
    <button id="play" class="btn">Играть</button>
  </div>

  <div id="over" class="screen hidden">
    <h2>Башня рухнула</h2>
    <div class="final"><span id="final-score">0</span><small>блоков</small></div>
    <p class="record hidden" id="new-record">Новый рекорд! 🎉</p>
    <p class="best">Рекорд: <b id="over-best">0</b></p>
    <button id="again" class="btn">Ещё раз</button>
    <button id="share" class="btn btn-ghost">Поделиться</button>
  </div>

  <script src="config.js"></script>
  <script src="platform.js"></script>
  <script src="game.js"></script>
</body>
</html>
